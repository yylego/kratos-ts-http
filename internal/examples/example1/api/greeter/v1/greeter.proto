syntax = "proto3";

package greeter.v1;

import "google/api/annotations.proto";

option go_package = "helloworld/api/greeter/v1;v1";

// Greeter says hello.
// Greeter 提供问候服务。
service Greeter {
  // SayHello greets the name inside the request.
  // SayHello 向请求中指定的名字致以问候。
  //
  // The google.api.http option maps this RPC onto POST /v1/greeter/hello, and the generated
  // TypeScript client posts to just that path. Without it the client has no address to reach.
  // google.api.http 把这个 RPC 映射到 POST /v1/greeter/hello，生成的 TypeScript 客户端
  // 请求的就是这个地址。没有它，客户端不知道该往哪儿发请求。
  rpc SayHello(SayHelloParam) returns (SayHelloResp) {
    option (google.api.http) = {
      post: "/v1/greeter/hello"
      body: "*"
    };
  }

  // StreamHello sends the greeting in pieces, one message each time.
  // StreamHello 把问候语分成几段，一段一段推送。
  //
  // Kratos v3 serves a server-streaming RPC through HTTP as Server-Sent Events, and the generated
  // TypeScript client reads them with for await.
  // Kratos v3 通过 HTTP 以 SSE 推送服务端流式 RPC，生成的 TypeScript 客户端用 for await 逐条读取。
  rpc StreamHello(SayHelloParam) returns (stream SayHelloResp) {
    option (google.api.http) = {
      post: "/v1/greeter/hello/stream"
      body: "*"
    };
  }

  // ChatHello greets each name as it comes in, while the connection stays open.
  // ChatHello 在连接保持期间，每收到一个名字就回一句问候。
  //
  // Kratos v3 serves a duplex RPC through HTTP as a WebSocket on a GET route, and the generated
  // TypeScript client writes with send and reads with for await.
  // Kratos v3 通过 HTTP 以 WebSocket 提供双向流式 RPC（走 GET 路由），生成的 TypeScript 客户端用 send 发、用 for await 读。
  rpc ChatHello(stream SayHelloParam) returns (stream SayHelloResp) {
    option (google.api.http) = {get: "/v1/greeter/hello/chat"};
  }
}

// SayHelloParam carries the name to greet.
// SayHelloParam 携带要问候的名字。
message SayHelloParam {
  // The name to greet.
  // 要问候的名字。
  string name = 1;
}

// SayHelloResp holds the greeting text.
// SayHelloResp 承载问候语文本。
message SayHelloResp {
  // The greeting text.
  // 问候语文本。
  string message = 1;
}
